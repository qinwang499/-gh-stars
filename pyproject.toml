[project]
name = "gh-stars"
version = "0.1.0"
description = "输入 GitHub 用户名，输出仓库 star 排行榜并存成 CSV"
readme = "README.md"
authors = [
    { name = "qinwang499", email = "qiwangling@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
gh-stars = "gh_stars.core:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
